# Render Blueprint Configuration for Campus Connect
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: campus-connect
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # If using Render's managed PostgreSQL database (defined below),
      # DATABASE_URL is automatically linked.
      - key: DATABASE_URL
        fromDatabase:
          name: campus-connect-db
          property: connectionString
      # Set your Cloudinary credentials in Render Dashboard:
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: campus-connect-db
    plan: free
    databaseName: campusconnect
    user: campusconnect

